<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;background:#fff}
  iframe{border:0;display:block}
</style></head>
<body>
<iframe id="f" src="/ambassadors" scrolling="no"></iframe>
<script>
  const q = new URLSearchParams(location.search);
  const f = document.getElementById('f');
  f.style.height = (Number(q.get('h') || 3700)) + 'px';
  f.style.width = (Number(q.get('w') || 1367)) + 'px';
  f.addEventListener('load', async () => {
    const d = f.contentDocument;
    const s = d.createElement('style');
    s.textContent = '.bb-cookie,nextjs-portal,#__next-build-watcher{display:none!important}';
    d.head.appendChild(s);
    try { await d.fonts.ready; } catch (e) {}
    await new Promise(r => setTimeout(r, 1400));
    if (q.get('fit')) {
      f.style.height = '10px';
      f.style.height = d.documentElement.scrollHeight + 'px';
      await new Promise(r => setTimeout(r, 400));
    }
    document.title = 'W' + d.documentElement.scrollWidth + '/' + f.offsetWidth;
  });
</script>
</body></html>
